[package]
name = "supertux-remastered-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Graphical installer for SuperTux Remastered"
license = "GPL-3.0-or-later"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
dirs = "6"
fs2 = "0.4"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
