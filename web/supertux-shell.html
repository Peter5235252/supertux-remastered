<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050b13" />
  <title>SuperTux Remastered — WebGL 2 / WASM</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b13;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loading {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #050b13;
      color: #e8f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e3a5f;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px 0; font-size: 1.5rem; letter-spacing: 0.05em; }
    p { margin: 0 0 16px 0; opacity: 0.8; font-size: 0.95rem; }
    .progress {
      width: 320px;
      height: 6px;
      background: #1e3a5f;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    .progress-text {
      font-size: 0.85rem;
      opacity: 0.7;
    }
    #error {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #5b1a1a;
      color: #ffd6d6;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }
    #error h2 { margin-top: 0; }
    #error button {
      margin-top: 16px;
      padding: 10px 20px;
      background: #38bdf8;
      color: #050b13;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #error button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="file-upload" type="file" multiple hidden />

  <div id="loading">
    <div class="spinner"></div>
    <h1>SuperTux Remastered</h1>
    <p id="loading-text">Preparing WebGL 2 renderer…</p>
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <p class="progress-text" id="progress-text">0%</p>
  </div>

  <div id="error">
    <h2 id="error-title">Game startup failed</h2>
    <p id="error-msg"></p>
    <p>Use a browser with WebGL 2 support (OpenGL ES 3.0).</p>
    <button onclick="location.reload()">Retry</button>
  </div>

  <script type="module">
    function setProgress(pct, label) {
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = pct + '%';
      const el = document.getElementById('loading-text');
      if (label) el.textContent = label;
    }

    // Configure the emscripten Module before the glue script runs.
    // Must be on global scope (window) so supertux2.js can find it.

    async function fetchDataBlob() {
      const manifestUrl = new URL('supertux2.data.parts', document.baseURI);
      const manifestResponse = await fetch(manifestUrl);
      if (!manifestResponse.ok) {
        throw new Error(`HTTP ${manifestResponse.status} while downloading game-data manifest`);
      }

      const chunkCount = Number((await manifestResponse.text()).trim());
      if (!Number.isSafeInteger(chunkCount) || chunkCount < 1 || chunkCount > 100) {
        throw new Error('Invalid game-data chunk count in deployment manifest.');
      }

      const chunks = [];
      for (let i = 0; i < chunkCount; i++) {
        const suffix = String.fromCharCode(97 + Math.floor(i / 26)) + String.fromCharCode(97 + (i % 26));
        const url = new URL(`supertux2.data.part${suffix}`, document.baseURI);
        setProgress(100, `Downloading game data — chunk ${suffix.toUpperCase()}…`);

        const resp = await fetch(url);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status} while downloading ${url.pathname}`);
        }

        const blob = await resp.blob();
        if (blob.size === 0) {
          throw new Error(`Empty game data chunk: ${url.pathname}`);
        }

        chunks.push(blob);
        console.log(`[superTux] Fetched chunk ${suffix.toUpperCase()} (${blob.size} bytes)`);
      }

      const fullBlob = new Blob(chunks, { type: 'application/octet-stream' });
      const blobUrl = URL.createObjectURL(fullBlob);
      console.log(`[superTux] Reassembled .data: ${fullBlob.size} bytes from ${chunks.length} chunks`);
      return blobUrl;
    }

    let DATA_BLOB_URL = null;

    // Browser APIs normally supplied by mk/emscripten/template.html.in.
    // The custom shell must provide the same hooks used by the C++ Emscripten build.
    const SUPERTUX_USER_DATA_ROOT = '/home/web_user/.local/share/supertux2/';
    let saving = false;
    let firstFramePresented = false;
    let setResolution = null;
    let autofit = true;
    let canResize = false;
    let onDownloadProgress = null;
    let onDownloadFinished = null;
    let onDownloadError = null;
    let onDownloadAborted = null;

    window.supertux_loadFiles = function() {
      try {
        const savedConfig = localStorage.getItem('supertux2_config');
        if (savedConfig !== null) {
          FS.writeFile(SUPERTUX_USER_DATA_ROOT + 'config', savedConfig);
        }
      } catch (error) {
        console.warn('[superTux] Could not restore browser config:', error);
      }
    };

    window.supertux2_syncfs = function() {
      if (saving) return;
      saving = true;
      try {
        FS.syncfs((error) => {
          if (error) console.warn('[superTux] IndexedDB sync failed:', error);
          saving = false;
        });
      } catch (error) {
        saving = false;
        console.warn('[superTux] Could not start IndexedDB sync:', error);
      }

      // ScreenManager calls this after each rendered frame. This is the
      // first safe point to resize: video, GPU and menu systems are initialized.
      if (!firstFramePresented) {
        firstFramePresented = true;
        requestAnimationFrame(() => {
          canResize = true;
          tryResize();
          document.getElementById('loading')?.classList.add('hidden');
        });
      }
    };

    window.supertux_saveFiles = function() {
      window.supertux2_syncfs();

      // localStorage is synchronous, so preserve config if the browser closes
      // before IndexedDB finishes its asynchronous sync.
      try {
        const config = FS.readFile(SUPERTUX_USER_DATA_ROOT + 'config', {
          encoding: 'utf8'
        });
        localStorage.setItem('supertux2_config', config);
      } catch (error) {
        console.warn('[superTux] Could not save browser config:', error);
      }
    };

    window.supertux_download = function(path) {
      try {
        const stat = FS.stat(path);
        const file = FS.open(path, 'r');
        const data = new Uint8Array(stat.size);
        FS.read(file, data, 0, stat.size, 0);
        FS.close(file);

        const blobUrl = URL.createObjectURL(new Blob([data], {
          type: 'application/octet-stream'
        }));
        const anchor = document.createElement('a');
        anchor.href = blobUrl;
        anchor.download = path.slice(path.lastIndexOf('/') + 1);
        anchor.style.display = 'none';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        return true;
      } catch (error) {
        console.error('[superTux] File download failed:', error);
        return false;
      }
    };

    const fileUpload = document.getElementById('file-upload');
    let uploadBasePath = '';
    window.supertux_upload = function(base) {
      uploadBasePath = String(base || '')
        .replace(/^\/+/, '')
        .replace(/\.\.(?:\/|$)/g, '')
        .replace(/\/+/g, '/');
      if (uploadBasePath && !uploadBasePath.endsWith('/')) {
        uploadBasePath += '/';
      }
      fileUpload.click();
    };

    fileUpload.addEventListener('change', async () => {
      try {
        for (const file of fileUpload.files) {
          const destination = SUPERTUX_USER_DATA_ROOT + uploadBasePath + file.name;
          const directory = destination.slice(0, destination.lastIndexOf('/'));
          FS.mkdirTree(directory);
          FS.writeFile(destination, new Uint8Array(await file.arrayBuffer()));
        }
        window.supertux2_syncfs();
      } catch (error) {
        console.error('[superTux] File upload failed:', error);
      } finally {
        fileUpload.value = '';
      }
    });

    window.supertux_xhr_file_download = function(ptr, id, url, file) {
      if (!onDownloadProgress || !onDownloadFinished || !onDownloadError || !onDownloadAborted) {
        console.error('[superTux] Downloader callbacks are not initialized');
        return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.responseType = 'arraybuffer';
      xhr.onload = () => {
        if (xhr.status < 200 || xhr.status >= 300) {
          onDownloadError(ptr, id);
          return;
        }
        try {
          const directory = file.slice(0, file.lastIndexOf('/'));
          if (directory) FS.mkdirTree(directory);
          FS.writeFile(file, new Uint8Array(xhr.response));
          onDownloadFinished(ptr, id, '');
          window.supertux2_syncfs();
        } catch (error) {
          console.error('[superTux] Download file write failed:', error);
          onDownloadError(ptr, id);
        }
      };
      xhr.addEventListener('progress', event => {
        onDownloadProgress(ptr, id, event.loaded, event.total);
      });
      xhr.addEventListener('error', () => onDownloadError(ptr, id));
      xhr.addEventListener('abort', () => onDownloadAborted(ptr, id));
      xhr.send();
    };

    window.supertux_xhr_string_download = function(ptr, id, url) {
      if (!onDownloadProgress || !onDownloadFinished || !onDownloadError || !onDownloadAborted) {
        console.error('[superTux] Downloader callbacks are not initialized');
        return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.responseType = 'text';
      xhr.onload = () => {
        if (xhr.status < 200 || xhr.status >= 300) {
          onDownloadError(ptr, id);
          return;
        }
        onDownloadFinished(ptr, id, xhr.responseText);
      };
      xhr.addEventListener('progress', event => {
        onDownloadProgress(ptr, id, event.loaded, event.total);
      });
      xhr.addEventListener('error', () => onDownloadError(ptr, id));
      xhr.addEventListener('abort', () => onDownloadAborted(ptr, id));
      xhr.send();
    };

    function tryResize() {
      if (!canResize || !autofit || !setResolution) return;
      try {
        setResolution(window.innerWidth, window.innerHeight);
      } catch (error) {
        console.warn('[superTux] Resize failed:', error);
      }
    }

    window.supertux_setAutofit = function(enabled) {
      autofit = Boolean(enabled);
      document.body.style.overflow = autofit ? 'hidden' : 'auto';
      tryResize();
    };

    window.addEventListener('resize', tryResize);

    function showError(title, error) {
      console.error('[superTux] ' + title + ':', error);
      document.getElementById('loading').classList.add('hidden');
      const errorElement = document.getElementById('error');
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-msg').textContent =
        error instanceof Error ? (error.stack || error.message) : String(error);
      errorElement.style.display = 'flex';
    }

    window.Module = {
      canvas: document.getElementById('canvas'),
      print: (text) => { console.log('[superTux]', text); },
      printErr: (text) => { console.warn('[superTux]', text); },
      noInitialRun: false,
      noExitRuntime: true,

      locateFile: (path) => {
        if (path.endsWith('.data')) {
          return DATA_BLOB_URL;
        }

        // Resolve runtime assets beside this HTTPS page, never against a
        // build-machine file:/// URL embedded in Emscripten's script prefix.
        const assetPath = /^file:\/\//i.test(path)
          ? path.slice(path.lastIndexOf('/') + 1)
          : path;
        const resolved = new URL(assetPath, new URL('./', window.location.href));
        if (resolved.protocol !== 'https:' && resolved.protocol !== 'http:') {
          throw new Error('Blocked non-web runtime asset URL: ' + resolved.href);
        }
        return resolved.href;
      },

      onRuntimeInitialized: () => {
        console.log('[superTux] Runtime initialized');
        try {
          setResolution = Module.cwrap('set_resolution', 'void', ['number', 'number']);
          onDownloadProgress = Module.cwrap('onDownloadProgress', 'void',
            ['number', 'number', 'number', 'number']);
          onDownloadFinished = Module.cwrap('onDownloadFinished', 'void',
            ['number', 'number', 'string']);
          onDownloadError = Module.cwrap('onDownloadError', 'void', ['number', 'number']);
          onDownloadAborted = Module.cwrap('onDownloadAborted', 'void', ['number', 'number']);
        } catch (error) {
          showError('Emscripten callback initialization failed', error);
        }
      },

      setStatus: (status) => {
        const match = status.match(/\((\d+)\/(\d+)\)/);
        if (match) {
          const loaded = Number(match[1]);
          const total = Number(match[2]);
          const pct = Math.round((loaded / total) * 100);
          setProgress(pct, `Downloading game data… ${pct}%`);
        } else {
          document.getElementById('loading-text').textContent = status;
        }
      },

      onReady: null,

      onAbort: (what) => {
        showError('Emscripten runtime aborted', what);
      },
    };

    // Alias for convenience
    const Module = window.Module;

    // Expose supertux_onready for the C++ EM_ASM callback.
    window.supertux_onready = () => {
      console.log('[superTux] C++ entry point reached');
      if (Module.onReady) Module.onReady();
    };

    // Global error handler for uncaught exceptions
    window.onerror = (msg, src, line, col, err) => {
      showError('JavaScript runtime error', err || `${msg} (${src}:${line}:${col})`);
      return true; // Prevent default browser error handling
    };

    window.addEventListener('unhandledrejection', (event) => {
      showError('Unhandled startup rejection', event.reason);
    });

    window.addEventListener('pagehide', () => {
      try {
        Module.ccall('save_config', 'void', [], []);
      } catch (error) {
        console.warn('[superTux] Could not save config on exit:', error);
      }
      window.supertux_saveFiles();
    });

    async function init() {
      // Download and reassemble the same-origin data chunks.
      // Keep this inside init() so failures are handled by the visible catch
      // handler below rather than an unhandled top-level module rejection.
      DATA_BLOB_URL = await fetchDataBlob();

      // Small delay so the user sees the completed preparation state.
      await new Promise(r => setTimeout(r, 300));

      // Phase 2: Load the emscripten glue script (supertux2.js is built by CI
      // and placed next to this shell). The C++ main() runs via
      // emscripten_set_main_loop in ScreenManager::run().
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'supertux2.js';
        script.onload = () => {
          console.log('[superTux] supertux2.js loaded');
          resolve();
        };
        script.onerror = () => reject(new Error('Failed to load supertux2.js'));
        document.head.appendChild(script);
      });
    }

    // C++ calls supertux_onready before initialization; the first-frame
    // callback in supertux2_syncfs controls when the loading overlay disappears.

    init().then(() => {
      console.log('[superTux] Init complete, waiting for game to start');
      // Fallback: if game doesn't start within 30 seconds, show error
      setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading && !loading.classList.contains('hidden')) {
          console.error('[superTux] Game did not start within 30s');
          loading.classList.add('hidden');
          const errEl = document.getElementById('error');
          errEl.style.display = 'flex';
          document.getElementById('error-title').textContent = 'Game failed to start';
          document.getElementById('error-msg').textContent =
            'The game did not initialize. This may be a WebGL 2 compatibility issue. Check the browser console (F12) for details.';
        }
      }, 30000);
    }).catch((err) => {
      showError('Game loading failed', err);
    });
  </script>
</body>
</html>
