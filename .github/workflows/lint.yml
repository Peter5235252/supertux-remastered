name: Code Linting

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

jobs:
  lint_cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile the latest Cppcheck source. Download to a file first so a
      # truncated HTTP response cannot be hidden by a successful tar pipeline.
      - name: Install Cppcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ make curl jq

          RELEASE_API_URL="https://api.github.com/repos/danmar/cppcheck/releases/latest"
          # GitHub currently redirects this endpoint, so follow the 301.
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$RELEASE_API_URL" -o cppcheck-release.json
          TARBALL_URL=$(jq --exit-status --raw-output \
            '.tarball_url | select(type == "string" and length > 0)' cppcheck-release.json)

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$TARBALL_URL" -o cppcheck.tar.gz
          tar --extract --gzip --file=cppcheck.tar.gz

          CPPHECK_SOURCE_DIR=$(find . -maxdepth 1 -type d -name 'danmar-cppcheck-*' -print -quit)
          test -n "$CPPHECK_SOURCE_DIR"
          make -C "$CPPHECK_SOURCE_DIR" -j"$(nproc)" CXXFLAGS="-O1 -DNDEBUG"

      - name: Lint code with Cppcheck
        run: |
          ./danmar-cppcheck-*/cppcheck \
            --check-level=exhaustive --include=mk/cppcheck/include/SDL.h \
            --quiet --inline-suppr --language=c++ --error-exitcode=10 \
            -j"$(nproc)" --std=c++17 --enable=warning,style \
            --suppress=useStlAlgorithm -U__EMSCRIPTEN__ -UDOXYGEN_SCRIPTING src/
