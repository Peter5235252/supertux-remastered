name: WebAssembly

# Keep only the newest deployment build for each ref.
concurrency:
  group: wasm-pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wasm:
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole tree so git describe works
          fetch-depth: 0
          submodules: recursive

      - name: Install emscripten tools
        run: |
          cd ~

          sudo apt-get update
          sudo apt-get install -y git cmake build-essential curl zip ninja-build

          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          # XDL_wgpu is validated against Emscripten 6.0.3 and its emdawnwebgpu port.
          ./emsdk install 6.0.3
          ./emsdk activate 6.0.3

          vcpkg integrate install

      - name: Use cached dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: wasm-dependencies-${{ hashFiles('.github/workflows/wasm.yml') }}

      - name: Configure build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir build
          cd build
          # WebGPU on WASM via XDL_wgpu + emdawnwebgpu.
          emcmake cmake .. -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DWARNINGS=ON \
                           -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
                           -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
                           -DVCPKG_TARGET_TRIPLET=wasm32-emscripten -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                           -DVCPKG_MANIFEST_FEATURES=core

      - name: Sync data folder
        working-directory: build
        run: |
          rsync -aP ../data/ data/

      - name: Build
        working-directory: build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build . -j$(nproc)

        # Now you can run a local server with: `emrun supertux2.html`
        # Or any traditional web server will do the job
        # Note: opening the html file manually (file:///) won't work

      - name: Verify WebGPU backend link selection
        working-directory: build
        run: |
          test -f supertux2.map
          grep -F 'libXDL_wgpu.a(SDL_gpu.c.o)' supertux2.map
          if grep -Fq 'libSDL3.a(SDL_gpu.c.o)' supertux2.map; then
            echo "ERROR: stock SDL3 GPU backend was linked instead of XDL_wgpu"
            exit 1
          fi

      - name: Setup files for upload
        working-directory: build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Replace the emscripten default HTML with our custom shell.
          cp ../web/supertux-shell.html supertux2.html
          mkdir upload/
          mv supertux2* upload/

      - uses: actions/upload-artifact@v4
        if: matrix.build_type != 'Debug'
        with:
          name: "wasm32-emscripten-${{ matrix.build_type }}-html"
          path: build/upload/*
          if-no-files-found: ignore

      - name: Build website (React/Vite)
        if: github.ref == 'refs/heads/main' && matrix.build_type == 'Release'
        working-directory: website
        run: |
          npm ci
          VITE_BASE=/supertux-remastered/ npm run build
          ls -la dist/

      - name: Prepare publish dir (website + WASM)
        if: github.ref == 'refs/heads/main' && matrix.build_type == 'Release'
        run: |
          mkdir -p publish/wasm
          # Copy React website build to root (including all assets)
          cp -a website/dist/. publish/
          # Copy WASM build (excluding .data) to wasm/
          cd build/upload
          for f in *; do
            case "$f" in
              *.data) echo "Skipping large data file: $f" ;;
              *) cp -a "$f" "../../publish/wasm/" ;;
            esac
          done
          cd ../..
          # GitHub Pages rejects individual files larger than 100 MiB.
          # Split the Emscripten data package into same-origin 50 MB chunks.
          test -f build/upload/supertux2.data
          split -b 50M -a 2 build/upload/supertux2.data publish/wasm/supertux2.data.part
          echo "=== Published game-data chunks ==="
          ls -lh publish/wasm/supertux2.data.part*

          # Copy shader files for WebGPU WGSL pre-compilation
          mkdir -p publish/wasm/shader
          cp -a data/shader/*.wgsl publish/wasm/shader/
          echo "=== Published files ==="
          find publish -type f | head -40

      - name: Upload .data file to GitHub Release
        if: github.ref == 'refs/heads/main' && matrix.build_type == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          files: build/upload/*.data
          fail_on_unmatched_files: false

      - name: Publish website + WASM port to GitHub Pages
        if: github.ref == 'refs/heads/main' && matrix.build_type == 'Release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: false
