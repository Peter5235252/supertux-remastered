name: Android

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Generate temporary signing key
        run: |
          mkdir -p android-signing
          PASS="$(openssl rand -hex 24)"
          printf '%s' "$PASS" > android-signing/password
          keytool -genkeypair -v -keystore android-signing/supertux.keystore -storetype PKCS12 -storepass "$PASS" -alias supertux -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SuperTux Remastered Temporary Test Key"
      - name: Share signing key with ABI jobs
        uses: actions/upload-artifact@v4
        with:
          name: temporary-android-test-signing-key
          path: android-signing/
          retention-days: 1

  android:
    needs: signing-key
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-latest
    env:
      # SUPERTUX_VERSION is set later using git describe.
      B_T_VERSION: 35.0.0
      NDK_VERSION: 29.0.14206865
      SDK_VERSION: 35
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the whole tree so git describe works
          fetch-depth: 0
          submodules: recursive

      - name: Prepare SUPERTUX_VERSION
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "SUPERTUX_VERSION=$tag" >> $GITHUB_ENV
          echo "SUPERTUX_VERSION: $tag"

      - name: Select Android vcpkg triplet
        run: |
          case "${{ matrix.arch }}" in
            arm64-v8a) VCPKG_TRIPLET=arm64-android ;;
            armeabi-v7a) VCPKG_TRIPLET=arm-neon-android ;;
            x86) VCPKG_TRIPLET=x86-android ;;
            x86_64) VCPKG_TRIPLET=x64-android ;;
            *) echo "Unsupported Android ABI: ${{ matrix.arch }}"; exit 67 ;;
          esac
          echo "VCPKG_TRIPLET=$VCPKG_TRIPLET" >> "$GITHUB_ENV"
          echo "Android ABI ${{ matrix.arch }} uses $VCPKG_TRIPLET"

      - name: Use cached dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: android-${{ matrix.arch }}-vcpkg-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Bootstrap custom vcpkg
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          cd vcpkg
          ./bootstrap-vcpkg.sh

          ./vcpkg install --classic --triplet=$VCPKG_TRIPLET \
            fmt     \
            libogg   \
            libvorbis \
            libraqm    \
            freetype    \
            physfs      \
            glm         \
            libpng      \
            zlib        \
            vulkan      \
            "sdl3[vulkan]"   \
            sdl3-image[jpeg,png]  \
            sdl3-ttf    \
            curl        \
            openal-soft \
            libogg      \
            libvorbis

          find $VCPKG_ROOT/installed -name '*.pc' -exec sed -i -E 's/-lc\+\+//g' {} \;

      - name: Match SDL Android project to the native vcpkg SDL
        run: |
          SDL_HEADER="$VCPKG_ROOT/installed/$VCPKG_TRIPLET/include/SDL3/SDL_version.h"
          test -f "$SDL_HEADER" || {
            echo "error: SDL version header not found: $SDL_HEADER"
            exit 1
          }

          SDL_MAJOR=$(awk '$2 == "SDL_MAJOR_VERSION" { print $3; exit }' "$SDL_HEADER")
          SDL_MINOR=$(awk '$2 == "SDL_MINOR_VERSION" { print $3; exit }' "$SDL_HEADER")
          SDL_MICRO=$(awk '$2 == "SDL_MICRO_VERSION" { print $3; exit }' "$SDL_HEADER")
          SDL_TAG="$SDL_MAJOR.$SDL_MINOR.$SDL_MICRO"

          if [[ -z "$SDL_MAJOR" || -z "$SDL_MINOR" || -z "$SDL_MICRO" ]]; then
            echo "error: failed to read SDL version from $SDL_HEADER"
            exit 1
          fi

          echo "SDL_TAG=$SDL_TAG" >> "$GITHUB_ENV"
          echo "Native SDL version: $SDL_TAG"

      - name: Prepare SDL Android project
        run: |
          # Match the Java SDLActivity classes to the native SDL library.
          ./tools/bootstrap-android-project.sh "${SDL_TAG}"

          echo "vcpkg_root=$VCPKG_ROOT" > mk/android/local.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.SDK_VERSION }} ndk;${{ env.NDK_VERSION }} build-tools;${{ env.B_T_VERSION }}'

      - name: Run slugify
        id: slugify
        uses: eltimn/slugify-action@v2.0.2

      - name: Build APK
        working-directory: mk/android/
        env:
          # Using git rev-parse gives incorrect values when querying the branch
          # so, use slugify instead
          GIT_HASH: ${{ steps.slugify.outputs.sha }}
          GIT_BRANCH: ${{ steps.slugify.outputs.branch }}
        run: |
          tree

          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pcpuarch="${{ matrix.arch }}" \
            -Pcmake_args="-DGIT_HASH=$GIT_HASH;-DGIT_BRANCH=$GIT_BRANCH" \
            --info

      - name: Rename APK
        run: |
          mv mk/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            mk/android/app/build/outputs/apk/release/SuperTux-Android-${{ matrix.arch }}-unsigned.apk

      - name: Verify native Vulkan GPU backend in the APK
        working-directory: mk/android
        run: |
          APK=app/build/outputs/apk/release/SuperTux-Android-${{ matrix.arch }}-unsigned.apk
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" 'lib/*/libsupertux2.so' -d /tmp/apkcheck
          SO=$(find /tmp/apkcheck -name libsupertux2.so | head -1)
          test -n "$SO" || { echo "error: libsupertux2.so not found in APK"; exit 1; }
          # This fork has no OpenGL renderer, so a missing SDL Vulkan GPU
          # backend means the game cannot start at all on Android.
          strings "$SO" | grep -q vkCreateInstance \
            || { echo "error: SDL lacks the Vulkan GPU backend (vkCreateInstance missing)"; exit 1; }
          echo "Vulkan GPU backend present: $SO"

      - name: Download temporary signing key
        uses: actions/download-artifact@v4
        with:
          name: temporary-android-test-signing-key
          path: android-signing

      - name: Sign and verify APK
        working-directory: mk/android/app/build/outputs/apk/release
        run: |
          APK="SuperTux-Android-${{ matrix.arch }}.apk"
          cp "SuperTux-Android-${{ matrix.arch }}-unsigned.apk" "$APK"
          export ANDROID_SIGNING_PW="$(cat "$GITHUB_WORKSPACE/android-signing/password")"
          "$ANDROID_SDK_ROOT/build-tools/${B_T_VERSION}/apksigner" sign --ks "$GITHUB_WORKSPACE/android-signing/supertux.keystore" --ks-key-alias supertux --ks-pass env:ANDROID_SIGNING_PW "$APK"
          "$ANDROID_SDK_ROOT/build-tools/${B_T_VERSION}/apksigner" verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: "Signed SuperTux APK ${{ matrix.arch }}"
          path: "mk/android/app/build/outputs/apk/release/SuperTux-Android-${{ matrix.arch }}.apk"


  publish:
    if: github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: "Signed SuperTux APK *"
          path: android-apks
          merge-multiple: true

      - name: Verify all Android architectures were produced
        run: |
          set -euo pipefail
          count=$(find android-apks -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$count" -eq 4
          ls -lh android-apks/

      - name: Publish Android APKs to the rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          files: android-apks/*.apk
          fail_on_unmatched_files: true

      - name: Publish same-origin APKs for the WebUSB installer
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./android-apks
          destination_dir: downloads/android
          keep_files: true
