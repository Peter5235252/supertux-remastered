plugins {
    id 'com.android.application'
}

Properties props = new Properties()
if (rootProject.file("${rootDir}/local.properties").exists()) {
    props.load(rootProject.file("${rootDir}/local.properties").newDataInputStream())
}

final APP_ID = "org.supertux.supertux2"
final TARGET_SDK = 35
final MIN_SDK = 28

android {
    namespace APP_ID
    compileSdkVersion TARGET_SDK

    defaultConfig {
        applicationId APP_ID
        targetSdkVersion TARGET_SDK

        // The current SDL3/vcpkg Android build depends on system iconv from Android 9.
        minSdkVersion MIN_SDK

        // NOTE: Don't forget to bump the version code!
        versionCode 7
        versionName "0.7.0"

        ndkVersion "29.0.14206865"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-" + MIN_SDK.toString(),
                          "-DCMAKE_VERBOSE_MAKEFILE=On",
                          "-DANDROID_STL=c++_shared",
                          "-DANDROID=On",
                          "-DSUPERTUX_VCPKG_ROOT=" + props.getProperty("vcpkg_root", ""),
                          "-DSUPERTUX_NDK_HOME=" + props.getProperty("ndk_home", ""),
                          "-DVCPKG_MANIFEST_MODE=OFF",
                          "-DVCPKG_VERBOSE=ON",
                          "-DUSE_SYSTEM_SDL2_TTF=ON",
                          "-DANDROID_ALLOW_UNDEFINED_SYMBOLS=OFF", // Literally what the fuck
                          //"--debug-find", // If something isn't being found, uncomment this
                          "--log-level", "TRACE",
                          "-Wno-dev"
                abiFilters rootProject.ext.cpuarch as String[]
            }
            if (rootProject.ext.googleplay) {
                android.defaultConfig.externalNativeBuild.cmake.arguments.add("-DSUPERTUX_GOOGLE_PLAY=ON")
            }
            android.defaultConfig.externalNativeBuild.cmake.arguments.addAll(rootProject.ext.cmake_args)
        }
    }

    if (rootProject.ext.bundle) {
        assetPacks = [":assetpack"]
    } else {
        sourceSets {
            main {
                assets.srcDirs += ['../assetpack/src/main/assets']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path '../../../CMakeLists.txt'
            }
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
